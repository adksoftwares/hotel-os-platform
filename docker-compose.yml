version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hotel_management_db
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
